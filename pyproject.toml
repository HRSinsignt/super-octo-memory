[project]
name = "jse-investment-horizon"
version = "0.1.0"
description = "Investment Horizon scoring engine for JSE-listed companies"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
live-api = ["requests>=2.31"]

[project.scripts]
jse-score = "jse_platform.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jse_platform*"]
